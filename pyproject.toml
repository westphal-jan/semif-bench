[project]
name = "semif-bench"
version = "0.1.0"
description = "Classify PubMed RCT abstract sentences with SemIf"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub",
    "pydantic>=2",
    "semif-phase1[mlx]",
]

[dependency-groups]
dev = ["ruff"]

[tool.uv]
package = false

[tool.uv.sources]
semif-phase1 = { path = "vendor-semif", editable = true }

[tool.ruff]
line-length = 120
extend-exclude = ["vendor-semif"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
